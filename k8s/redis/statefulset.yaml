apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: playmood
spec:
  serviceName: redis-svc
  replicas: 1
  selector: 
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        command: ["redis-server", "--appendonly", "yes"]
        ports:
        - containerPort: 6379
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        volumeMounts:
        - name: redis-data
          mountPath: /data
        readinessProbe:
          exec:
            command: ["redis-cli", "ping"]
          initialDelaySeconds: 5
          periodSeconds: 5
  volumeClaimTemplates:
  - metadata: 
      name: redis-data
    spec:
      accessModes: ["ReadWriteOnce"]
      resources: 
        requests:
          storage: 1Gi
---
apiVersion: v1
kind: Service
metadata: 
  name: redis-svc
  namespace: playmood
spec:
  selector: 
    app: redis
  ports:
  - port: 6379
    targetPort: 6379
  clusterIP: None