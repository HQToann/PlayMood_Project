<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PlayMood - Đăng Nhập / Đăng Ký</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Auth Custom CSS -->
    <link href="{% static 'css/auth.css' %}?v=1.3" rel="stylesheet">
</head>
<body class="auth-page">

    <div class="auth-container" id="authContainer">
        
        <!-- Logo -->
        <a href="#" class="auth-logo">
            <div class="brand-icon"><i class="bi bi-music-note"></i></div>
            PlayMood
        </a>
        <p class="auth-subtitle" id="authSubtitle">Đăng nhập để khám phá thế giới âm nhạc của riêng bạn.</p>

        <!-- ================= LOGIN FORM ================= -->
        <div class="auth-login-form">
            <form id="loginForm">
                <div id="loginError" class="text-danger small mb-2 text-center" style="display:none;"></div>
                <div class="auth-form-group">
                    <input type="email" id="loginEmail" class="auth-input" placeholder="Email" required>
                    <i class="bi bi-envelope"></i>
                </div>
                
                <div class="auth-form-group">
                    <input type="password" id="loginPassword" class="auth-input" placeholder="Mật khẩu" required>
                    <i class="bi bi-lock"></i>
                </div>
                
                <div class="auth-links">
                    <label class="d-flex align-items-center gap-2" style="cursor: pointer;">
                        <input type="checkbox" style="accent-color: #8CA4D6;"> Ghi nhớ tài khoản
                    </label>
                    <a href="#" class="auth-link">Quên mật khẩu?</a>
                </div>

                <button type="submit" class="btn-auth-submit">Đăng nhập</button>
            </form>


            <div class="auth-switch">
                Chưa có tài khoản? <a href="#" onclick="toggleAuth(true); return false;">Đăng ký ngay</a>
            </div>
        </div>

        <!-- ================= REGISTER FORM ================= -->
        <div class="auth-register-form">
            <form id="registerForm">
                <div id="registerError" class="text-danger small mb-2 text-center" style="display:none;"></div>
                <div class="auth-form-group">
                    <input type="text" id="registerUsername" class="auth-input" placeholder="Tên đăng nhập" required>
                    <i class="bi bi-person"></i>
                </div>

                <div class="auth-form-group">
                    <input type="email" id="registerEmail" class="auth-input" placeholder="Email" required>
                    <i class="bi bi-envelope"></i>
                </div>
                
                <div class="auth-form-group">
                    <input type="password" id="registerPassword" class="auth-input" placeholder="Mật khẩu" required>
                    <i class="bi bi-lock"></i>
                </div>

                <div class="auth-form-group">
                    <input type="password" id="registerConfirmPassword" class="auth-input" placeholder="Xác nhận mật khẩu" required>
                    <i class="bi bi-shield-lock"></i>
                </div>

                <button type="submit" class="btn-auth-submit">Tạo tài khoản</button>
            </form>

            <div class="auth-switch">
                Đã có tài khoản? <a href="#" onclick="toggleAuth(false); return false;">Đăng nhập</a>
            </div>
        </div>
        
    </div>

    <!-- Script xử lý Giao diện và API -->
    <script>
        function toggleAuth(isRegister) {
            const container = document.getElementById('authContainer');
            const subtitle = document.getElementById('authSubtitle');
            document.getElementById('loginError').style.display = 'none';
            document.getElementById('registerError').style.display = 'none';
            
            if (isRegister) {
                container.classList.add('is-register');
                subtitle.innerText = "Tạo tài khoản mới để trải nghiệm đầy đủ tính năng.";
            } else {
                container.classList.remove('is-register');
                subtitle.innerText = "Đăng nhập để khám phá thế giới âm nhạc của riêng bạn.";
            }
        }

        // Lấy CSRF token từ cookie
        function getCookie(name) {
            let cookieValue = null;
            if (document.cookie && document.cookie !== '') {
                const cookies = document.cookie.split(';');
                for (let i = 0; i < cookies.length; i++) {
                    const cookie = cookies[i].trim();
                    if (cookie.substring(0, name.length + 1) === (name + '=')) {
                        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                        break;
                    }
                }
            }
            return cookieValue;
        }

        // Gọi API CSRF trước khi POST
        async function fetchCsrf() {
            await fetch('/api/v1/auth/csrf/');
        }

        // Xử lý Form Đăng Nhập
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            const errorDiv = document.getElementById('loginError');
            errorDiv.style.display = 'none';

            try {
                await fetchCsrf();
                const csrfToken = getCookie('csrftoken');

                const response = await fetch('/api/v1/auth/login/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': csrfToken
                    },
                    body: JSON.stringify({ email, password })
                });

                const result = await response.json();
                if (response.ok && result.success) {
                    window.location.href = "{% url 'home' %}";
                } else {
                    errorDiv.innerText = result.error?.message || 'Đăng nhập thất bại. Vui lòng kiểm tra lại.';
                    errorDiv.style.display = 'block';
                }
            } catch (error) {
                errorDiv.innerText = 'Lỗi kết nối máy chủ. Vui lòng thử lại sau.';
                errorDiv.style.display = 'block';
            }
        });

        // Xử lý Form Đăng Ký
        document.getElementById('registerForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const username = document.getElementById('registerUsername').value;
            const email = document.getElementById('registerEmail').value;
            const password = document.getElementById('registerPassword').value;
            const confirmPassword = document.getElementById('registerConfirmPassword').value;
            const errorDiv = document.getElementById('registerError');
            errorDiv.style.display = 'none';

            if (password !== confirmPassword) {
                errorDiv.innerText = 'Mật khẩu xác nhận không khớp.';
                errorDiv.style.display = 'block';
                return;
            }

            try {
                await fetchCsrf();
                const csrfToken = getCookie('csrftoken');

                const response = await fetch('/api/v1/auth/register/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': csrfToken
                    },
                    body: JSON.stringify({ username, email, password })
                });

                const result = await response.json();
                if (response.ok && result.success) {
                    // Đăng ký thành công, tự động đăng nhập hoặc chuyển về màn hình đăng nhập
                    alert('Đăng ký thành công! Vui lòng đăng nhập.');
                    toggleAuth(false);
                    document.getElementById('loginEmail').value = email;
                    document.getElementById('loginPassword').value = '';
                } else {
                    // Hiển thị lỗi từ backend
                    let errorMsg = result.error?.message || 'Đăng ký thất bại.';
                    if (result.error?.fields) {
                        const firstError = Object.values(result.error.fields)[0];
                        if (firstError && firstError.length > 0) {
                            errorMsg = firstError[0];
                        }
                    }
                    errorDiv.innerText = errorMsg;
                    errorDiv.style.display = 'block';
                }
            } catch (error) {
                errorDiv.innerText = 'Lỗi kết nối máy chủ. Vui lòng thử lại sau.';
                errorDiv.style.display = 'block';
            }
        });
    </script>
</body>
</html>
