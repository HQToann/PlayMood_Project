{% extends "base.html" %}
{% load static %}

{% block content %}
<div class="content-scroll" id="mainContent">
    <div class="d-flex align-items-center mb-4">
        <button class="btn text-white me-3 p-0" onclick="history.back()" style="background: none; border: none; outline: none; font-size: 1.5rem;">
            <i class="bi bi-arrow-left"></i>
        </button>
        <div>
            <p class="mb-0 text-accent small fw-bold text-uppercase" style="letter-spacing: 1px;" id="exploreTypeLabel">GỢI Ý CHO BẠN</p>
            <h2 class="fw-bold text-white mb-0" id="exploreTitle">Khám Phá Cảm Xúc</h2>
        </div>
    </div>

    <!-- Grid Container -->
    <div id="exploreGrid" class="d-grid gap-4" style="grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));">
        <!-- Rendered by JS -->
    </div>

    <!-- Loading Spinner (for initial and infinite scroll) -->
    <div id="loadingSpinner" class="text-center py-5">
        <div class="spinner-border text-light" role="status">
            <span class="visually-hidden">Đang tải...</span>
        </div>
    </div>
    
    <!-- No more data message -->
    <div id="endMessage" class="text-center py-4 text-secondary d-none">
        Bạn đã xem hết danh sách.
    </div>
</div>

<script src="{% static 'js/components/card.js' %}?v=1.0"></script>
<script src="{% static 'js/mood_explore.js' %}?v=1.0"></script>
{% endblock %}
