{% load static %}
<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PlayMood - Bảng tin</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <!-- Custom CSS -->
    <link href="{% static 'css/style.css' %}" rel="stylesheet">
    <link href="{% static 'css/home.css' %}" rel="stylesheet">
    <link href="{% static 'css/posts.css' %}?v=2.0" rel="stylesheet">
</head>

<body>
    <div class="app-container">
        <!-- Main Wrapper -->
        <div class="main-wrapper">

            <!-- LEFT SIDEBAR -->
            {% include 'includes/left_sidebar.html' with active_page='feed' %}

            <!-- MAIN CONTENT -->
            <main class="main-content">
                <!-- Header -->
                {% include 'includes/top_header.html' %}

                <!-- Scrollable Content -->
                <div class="content-scroll">
                    <div style="padding: 24px 32px 140px 32px;">

                        <!-- POST FORM (Tạo bài viết mới) -->
                        <div class="post-create-box">
                            <div class="d-flex align-items-center gap-3 mb-3">
                                <img src="{% if request.user.avatar %}{{ request.user.avatar.url }}{% else %}https://ui-avatars.com/api/?name={{ request.user.username|default:'U' }}{% endif %}"
                                    class="rounded-circle flex-shrink-0" width="42" height="42"
                                    style="object-fit: cover; border: 2px solid rgba(255,255,255,0.08);">
                                <button class="post-create-trigger" data-bs-toggle="modal"
                                    data-bs-target="#createPostModal">
                                    {{ request.user.display_name }} ơi, bạn đang nghĩ gì thế?
                                </button>
                            </div>
                            <hr class="post-create-divider">
                            <div class="post-create-actions">
                                <button type="button" class="post-create-action-btn" onclick="openShareMusicFlow()">
                                    <i class="bi bi-music-note-beamed" style="color: #4CC9F0;"></i>
                                    Chia sẻ nhạc
                                </button>
                                <button class="post-create-action-btn" data-bs-toggle="modal"
                                    data-bs-target="#createPostModal"
                                    onclick="setTimeout(() => document.getElementById('postImageInput').click(), 500)">
                                    <i class="bi bi-images" style="color: #8CE1B2;"></i>
                                    Ảnh/Video
                                </button>
                                <button type="button" class="post-create-action-btn" onclick="openFeelingFlow()">
                                    <i class="bi bi-emoji-smile" style="color: #FFD166;"></i>
                                    Cảm xúc
                                </button>
                            </div>
                        </div>

                        <!-- FEED CONTAINER -->
                        <div id="postsFeedContainer">
                            <!-- Các Post sẽ được render bằng Javascript AJAX hoặc Django Template ở đây -->
                            <!-- Template mẫu (Được thay thế bằng dữ liệu thật qua posts.js) -->
                            <div class="text-center py-5">
                                <div class="spinner-border text-primary" role="status"></div>
                                <p class="text-muted-custom mt-2">Đang tải bảng tin...</p>
                            </div>
                        </div>

                    </div>
                </div>

            </main>


            <!-- RIGHT SIDEBAR (Friends Activity) -->
            {% include 'includes/right_sidebar.html' %}

        </div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
        <script src="{% static 'js/main.js' %}?v=2.2"></script>


        <script>
            window.CURRENT_USER_ID = "{{ request.user.id|default:'' }}";
        </script>

        <script src="{% static 'js/posts.js' %}?v=3.1"></script>
        <script src="{% static 'js/feeling.js' %}?v=1.2"></script>
        <script src="{% static 'js/tag_friends.js' %}?v=2.0"></script>
    </div> <!-- closes app-container -->
    <!-- PLAYER BAR -->
    {% include 'includes/player_bar.html' %}
</body>

</html>
