{% load static %}
<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PlayMood - Khám Phá</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <!-- Custom CSS -->
    <link href="{% static 'css/style.css' %}?v=5" rel="stylesheet">
    <link href="{% static 'css/home.css' %}" rel="stylesheet">
    <link href="{% static 'css/explore.css' %}" rel="stylesheet">
</head>

<body>
    <div class="app-container">
        <!-- Main Wrapper -->
        <div class="main-wrapper">

            <!-- LEFT SIDEBAR -->
            {% include 'includes/left_sidebar.html' with active_page='explore' %}

            <!-- MAIN CONTENT -->
            <main class="main-content">
                <!-- Header -->
                {% include 'includes/top_header.html' %}

                <!-- Scrollable Content -->
                <div class="content-scroll" id="mainContent">
                    <div style="padding: 0 32px 140px 32px;">

                        <div class="d-flex align-items-center mb-4" style="margin-top: -15px;">
                            <button class="btn text-white me-3 p-0" onclick="history.back()" style="background: none; border: none; outline: none; font-size: 1.5rem;">
                                <i class="bi bi-arrow-left"></i>
                            </button>
                            <div>
                                <p class="mb-0 text-accent small fw-bold text-uppercase" style="letter-spacing: 1px;" id="exploreTypeLabel">KHÁM PHÁ</p>
                                <h2 class="fw-bold text-white mb-0" id="exploreTitle"><div class="skeleton" style="width: 250px; height: 32px; border-radius: 8px;"></div></h2>
                            </div>
                        </div>

                        <!-- Grid Container -->
                        <div id="exploreGrid" class="d-grid mb-5" style="grid-template-columns: repeat(5, 1fr); gap: 15px;">
                            <!-- Rendered by JS -->
                        </div>

                        <!-- Loading Spinner (for initial and infinite scroll) -->
                        <div id="loadingSpinner" class="d-none"></div>
                        
                        <!-- No more data message -->
                        <div id="endMessage" class="text-center py-4 text-secondary d-none">
                            Bạn đã xem hết danh sách.
                        </div>

                    </div>
                </div>
            </main>

            <!-- RIGHT SIDEBAR (Friend Activity) -->
            {% include 'includes/right_sidebar.html' %}
        </div>

        <!-- MUSIC PLAYER (Fixed Bottom) -->
        {% include 'includes/player_bar.html' %}
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{% static 'js/main.js' %}?v=2.2"></script>
    <script src="{% static 'js/explore_list.js' %}?v=1.1"></script>
</body>

</html>
