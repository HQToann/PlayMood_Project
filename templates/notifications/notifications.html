{% load static %}
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PlayMood - Dark Theme</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <!-- Custom CSS -->
    <link href="{% static 'css/style.css' %}?v=24" rel="stylesheet">
    <link href="{% static 'css/home.css' %}?v=24.2" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <!-- Main Wrapper -->
        <div class="main-wrapper">
            
            <!-- LEFT SIDEBAR -->
            {% include 'includes/left_sidebar.html' %}
            
            <!-- MAIN CONTENT -->
            <main class="main-content">
                <!-- Header -->
                {% include 'includes/top_header.html' %}
                
                <!-- Scrollable Content -->
                <div class="content-scroll">
                    <div class="notifications-section mt-3">
                        <div class="d-flex justify-content-between align-items-center mb-4">
                            <h2 class="section-title mb-0">Thông báo</h2>
                            <button id="markAllReadBtn" class="btn btn-sm btn-outline-secondary rounded-pill px-3" style="font-size: 0.85rem;">
                                <i class="bi bi-check2-all me-1"></i> Đánh dấu đã đọc tất cả
                            </button>
                        </div>

                        <!-- Danh sách thông báo - được render động bởi notifications.js -->
                        <div id="notificationListContainer" class="notification-list d-flex flex-column gap-2">
                            <!-- skeleton / items sẽ được JS inject vào đây -->
                        </div>
                    </div>
                </div>
            </main>

            <!-- RIGHT SIDEBAR (Friends Activity) -->
            {% include 'includes/right_sidebar.html' %}
            
        </div>
        
        <!-- PLAYER BAR -->
        {% include 'includes/player_bar.html' %}
    </div>
    
    <!-- Mobile Offcanvas Menu -->
    {% include 'includes/mobile_offcanvas.html' %}

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{% static 'js/main.js' %}?v=24.2"></script>
    <script src="{% static 'js/notifications.js' %}?v=24.1"></script>
</body>
</html>
