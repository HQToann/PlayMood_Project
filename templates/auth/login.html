{% load static %}
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PlayMood - Đăng Nhập / Đăng Ký</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Auth Custom CSS -->
    <link href="{% static 'css/auth.css' %}?v=1.6" rel="stylesheet">
</head>
<body class="auth-page">

    <div class="auth-container" id="authContainer">
        
        <!-- Logo -->
        <a href="#" class="auth-logo">
            <div class="brand-icon"><i class="bi bi-music-note"></i></div>
            PlayMood
        </a>
        <p class="auth-subtitle" id="authSubtitle">Đăng nhập để khám phá thế giới âm nhạc của riêng bạn.</p>

        <!-- ================= LOGIN FORM ================= -->
        <div class="auth-login-form">
            <form id="loginForm">
                <div id="loginError" class="text-danger small mb-2 text-center" style="display:none;"></div>
                <div class="auth-form-group">
                    <input type="email" id="loginEmail" class="auth-input" placeholder="Email" required>
                    <i class="bi bi-envelope"></i>
                </div>
                
                <div class="auth-form-group">
                    <input type="password" id="loginPassword" class="auth-input" placeholder="Mật khẩu" required style="padding-right: 45px;">
                    <i class="bi bi-lock"></i>
                    <i class="bi bi-eye-slash toggle-password" style="left: auto; right: 15px; cursor: pointer;" onclick="togglePasswordVisibility('loginPassword', this)"></i>
                </div>
                
                <div class="auth-links">
                    <label class="d-flex align-items-center gap-2" style="cursor: pointer;">
                        <input type="checkbox" style="accent-color: rgb(140, 225, 178);"> Ghi nhớ tài khoản
                    </label>
                    <a href="#" class="auth-link">Quên mật khẩu?</a>
                </div>

                <button type="submit" class="btn-auth-submit">Đăng nhập</button>
            </form>


            <div class="auth-switch">
                Chưa có tài khoản? <a href="#" onclick="toggleAuth(true); return false;">Đăng ký ngay</a>
            </div>
        </div>

        <!-- ================= REGISTER FORM ================= -->
        <div class="auth-register-form">
            <form id="registerForm">
                <div id="registerError" class="text-danger small mb-2 text-center" style="display:none;"></div>
                <div class="auth-form-group">
                    <input type="text" id="registerUsername" class="auth-input" placeholder="Tên đăng nhập" required>
                    <i class="bi bi-person"></i>
                </div>

                <div class="auth-form-group">
                    <input type="email" id="registerEmail" class="auth-input" placeholder="Email" required>
                    <i class="bi bi-envelope"></i>
                </div>
                
                <div class="auth-form-group">
                    <input type="password" id="registerPassword" class="auth-input" placeholder="Mật khẩu" required style="padding-right: 45px;">
                    <i class="bi bi-lock"></i>
                    <i class="bi bi-eye-slash toggle-password" style="left: auto; right: 15px; cursor: pointer;" onclick="togglePasswordVisibility('registerPassword', this)"></i>
                </div>

                <div class="auth-form-group">
                    <input type="password" id="registerConfirmPassword" class="auth-input" placeholder="Xác nhận mật khẩu" required style="padding-right: 45px;">
                    <i class="bi bi-shield-lock"></i>
                    <i class="bi bi-eye-slash toggle-password" style="left: auto; right: 15px; cursor: pointer;" onclick="togglePasswordVisibility('registerConfirmPassword', this)"></i>
                </div>

                <button type="submit" class="btn-auth-submit">Tạo tài khoản</button>
            </form>

            <div class="auth-switch">
                Đã có tài khoản? <a href="#" onclick="toggleAuth(false); return false;">Đăng nhập</a>
            </div>
        </div>
        
    </div>

    <!-- Script xử lý Giao diện và API -->
        <script>
        window.HOME_URL = "{% url 'home' %}";
    </script>
    <script src="{% static 'js/main.js' %}"></script>
    <script src="{% static 'js/auth.js' %}"></script>

</body>
</html>
