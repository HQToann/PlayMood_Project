<!-- =============================================
   POST MANAGEMENT MODALS (Edit & Delete)
   ============================================= -->

<!-- Edit Post Modal -->
<div class="modal fade" id="editPostModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content text-white"
             style="background: var(--bg-card); border: 1px solid rgba(255,255,255,0.08); border-radius: 16px;">
            <div class="modal-header" style="border-bottom: 1px solid rgba(255,255,255,0.07); padding: 16px 20px;">
                <h5 class="modal-title w-100 text-center fw-bold" style="font-size: 1rem;">Chỉnh sửa bài viết</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body" style="padding: 16px 20px;">
                <!-- Author info -->
                <div class="d-flex align-items-center gap-3 mb-3">
                    <img src="{% if request.user.avatar %}{{ request.user.avatar.url }}{% else %}https://ui-avatars.com/api/?name={{ request.user.username|default:'U' }}&background=random{% endif %}"
                         class="rounded-circle flex-shrink-0"
                         width="40" height="40"
                         style="object-fit: cover; border: 2px solid rgba(255,255,255,0.08);">
                    <div>
                        <div class="fw-bold" style="font-size: 0.92rem;">{{ request.user.get_display_name }}</div>
                        <small style="color: var(--text-secondary); font-size: 0.76rem;">Chỉnh sửa bài viết</small>
                    </div>
                </div>

                <input type="hidden" id="editPostIdInput">

                <!-- Content textarea -->
                <textarea class="w-100 bg-transparent text-white border-0 p-0 shadow-none"
                          id="editPostContentInput"
                          rows="5"
                          placeholder="Bạn đang nghĩ gì?"
                          style="resize: none; font-size: 1rem; outline: none; font-family: inherit; line-height: 1.6;"></textarea>

                <!-- Media preview (read-only) -->
                <div id="editPostMediaPreview" class="mt-3 p-3 rounded-3" style="background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.07); display: none;">
                    <div class="d-flex align-items-center gap-2 mb-2">
                        <i class="bi bi-image" style="color: var(--text-secondary);"></i>
                        <small style="color: var(--text-secondary); font-size: 0.78rem;">Đính kèm (không thể thay đổi)</small>
                    </div>
                    <div id="editPostMediaContent"></div>
                </div>
            </div>
            <div class="modal-footer" style="border-top: 1px solid rgba(255,255,255,0.07); padding: 12px 20px;">
                <button type="button" class="btn w-100 fw-bold" id="btnSubmitEditPost"
                        style="background: var(--accent-color); color: var(--bg-app); border-radius: 12px; padding: 10px; font-size: 0.92rem;">
                    Lưu thay đổi
                </button>
            </div>
        </div>
    </div>
</div>

<!-- Delete Post Modal -->
<div class="modal fade" id="deletePostModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered" style="max-width: 380px;">
        <div class="modal-content text-white"
             style="background: var(--bg-card); border: 1px solid rgba(255,255,255,0.08); border-radius: 16px;">
            <div class="modal-body p-4 text-center">
                <!-- Icon -->
                <div class="mb-3" style="font-size: 2.8rem; color: #e74c3c; line-height: 1;">
                    <i class="bi bi-trash3"></i>
                </div>
                <h5 class="fw-bold mb-2">Xóa bài viết?</h5>
                <p style="color: var(--text-secondary); font-size: 0.88rem; margin-bottom: 20px; line-height: 1.5;">
                    Bài viết sẽ bị xóa vĩnh viễn và không thể khôi phục lại.
                </p>
                <input type="hidden" id="deletePostIdInput">
                <div class="d-grid gap-2">
                    <button type="button" class="btn fw-bold" id="btnConfirmDeletePost"
                            style="background: #e74c3c; color: #fff; border-radius: 12px; padding: 10px; font-size: 0.92rem;">
                        Xóa bài viết
                    </button>
                    <button type="button" class="btn fw-semibold" data-bs-dismiss="modal"
                            style="background: rgba(255,255,255,0.07); color: #fff; border-radius: 12px; padding: 10px; font-size: 0.92rem; border: none;">
                        Hủy bỏ
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
