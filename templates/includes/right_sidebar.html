{% load static %}
            <!-- RIGHT SIDEBAR (Friends Activity) -->
            <aside class="sidebar-right d-none d-xl-block">
                <!-- Header Actions for Desktop Sidebar -->
                <div class="d-flex justify-content-end align-items-center mb-4 gap-2">
                    <!-- User Mood Tag -->
                    <div id="myMoodBadge" class="badge rounded-pill px-3 py-2 shadow-sm me-auto" style="display: none; background: linear-gradient(135deg, #F8B4B4, #E99CBB); color: #121929; font-weight: 600; font-size: 0.8rem; cursor: pointer;" title="Tâm trạng hiện tại của bạn">
                        <i class="bi bi-suit-heart-fill me-1"></i> Lãng Mạn
                    </div>
                    
                    <a href="{% url 'notifications_page' %}" class="btn-icon text-decoration-none" style="display: inline-flex; align-items: center; justify-content: center; color: inherit;">
                        <div class="position-relative d-inline-flex">
                            <i class="bi bi-bell"></i>
                            <span class="bell-badge position-absolute badge rounded-pill bg-danger" style="display:none; font-size: 0.55rem; padding: 2px 4px; top: 0; right: 0;"></span>
                        </div>
                    </a>
                                        <div class="dropdown">
                        <div class="user-profile" data-bs-toggle="dropdown" aria-expanded="false" style="cursor: pointer;">
                            <img src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?ixlib=rb-4.0.3&auto=format&fit=crop&w=100&q=80" alt="avatar" class="user-avatar">
                            <span style="font-size: 0.9rem; font-weight: 600; display: flex; align-items: center; gap: 4px;">
                                <span style="max-width: 65px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: inline-block;">{{ request.user.display_name|default:request.user.username }}</span>
                                <i class="bi bi-chevron-down small"></i>
                            </span>
                        </div>
                        <ul class="dropdown-menu dropdown-menu-dark dropdown-menu-end shadow-lg" style="background-color: var(--bg-card); min-width: 200px; border-radius: 12px; margin-top: 10px; border: 1px solid rgba(255,255,255,0.05);">
                            <li><a class="dropdown-item py-2" href="{% url 'profile_page' %}"><i class="bi bi-person me-3 text-muted-custom"></i> Hồ sơ cá nhân</a></li>
                            <li><a class="dropdown-item py-2" href="{% url 'settings_page' %}"><i class="bi bi-gear me-3 text-muted-custom"></i> Cài đặt</a></li>
                            <li><hr class="dropdown-divider border-secondary opacity-25"></li>
                            <li><a class="dropdown-item py-2 text-danger" href="#" data-bs-toggle="modal" data-bs-target="#logoutConfirmModal"><i class="bi bi-box-arrow-right me-3"></i> Đăng xuất</a></li>
                        </ul>
                    </div>
                    
                </div>

                <div class="d-flex justify-content-between align-items-center mb-3 mt-2">
                    <h6 class="mb-0 fw-bold">Hoạt động bạn bè</h6>
                    <div class="d-flex align-items-center gap-3">
                        <span class="text-accent small" id="onlineFriendsCount">0 online <i class="bi bi-people"></i></span>
                        <i class="bi bi-person-plus-fill text-muted-custom" style="cursor: pointer; font-size: 1.1rem; transition: color 0.2s;" onmouseover="this.classList.replace('text-muted-custom', 'text-white')" onmouseout="this.classList.replace('text-white', 'text-muted-custom')" title="Thêm bạn bè" data-bs-toggle="modal" data-bs-target="#addFriendModal"></i>
                    </div>
                </div>
                
                <div class="search-bar mb-4 w-100" style="padding: 8px 12px; border-radius: 12px; background: rgba(255, 255, 255, 0.03);">
                    <i class="bi bi-search text-muted-custom" style="font-size: 0.85rem;"></i>
                    <input type="text" id="friendSearchInput" placeholder="Tìm kiếm bạn bè..." style="font-size: 0.85rem; background: none; border: none; color: white; outline: none; width: 85%;">
                </div>
                
                <div id="friendsActivityContainer">
                    <div class="text-center text-muted-custom py-4 spinner-border-container">
                        <div class="spinner-border spinner-border-sm" role="status"></div>
                        <span class="ms-2 small">Đang tải...</span>
                    </div>
                </div>
                
            </aside>

    <!-- Logout Confirmation Modal -->
    <div class="modal fade" id="logoutConfirmModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content text-white" style="background-color: var(--bg-card); border: 1px solid rgba(255,255,255,0.05); border-radius: 16px;">
                <div class="modal-header border-bottom-0 pb-0">
                    <h5 class="modal-title fw-bold">Đăng xuất</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body text-secondary">
                    Bạn có chắc chắn muốn đăng xuất khỏi tài khoản của mình không?
                </div>
                <div class="modal-footer border-top-0 pt-0">
                    <button type="button" class="btn btn-outline-light rounded-pill px-4" data-bs-dismiss="modal">Hủy</button>
                    <button type="button" class="btn btn-danger rounded-pill px-4" onclick="handleLogout(event)">Đăng xuất</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Add Friend Modal -->
    <div class="modal fade custom-modal" id="addFriendModal" tabindex="-1" aria-labelledby="addFriendModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable" style="max-width: 450px;">
            <div class="modal-content text-light" style="background-color: var(--bg-card); border: 1px solid rgba(255,255,255,0.1); border-radius: 16px;">
                <div class="modal-header border-bottom-0 pb-0">
                    <h5 class="modal-title fw-bold" id="addFriendModalLabel">Thêm bạn bè</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body px-4 py-3">
                    <div class="search-bar mb-4 w-100" style="padding: 10px 16px; border-radius: 14px; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255,255,255,0.05);">
                        <i class="bi bi-search text-muted-custom" style="font-size: 1rem;"></i>
                        <input type="text" id="globalUserSearchInput" placeholder="Tìm kiếm theo Tên, Email hoặc Username..." style="font-size: 0.95rem; background: none; border: none; color: white; outline: none; width: 85%; margin-left: 10px;">
                    </div>
                    
                    <div id="globalUserSearchResults" class="d-flex flex-column gap-3">
                        <!-- Kết quả sẽ hiện ở đây -->
                        <div class="text-center text-muted-custom py-3 small">
                            Nhập từ khóa để tìm kiếm...
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    
    <!-- Nhúng script Friend Activity -->
    <script>
        window.CURRENT_USER_ID = "{{ request.user.id|default:'' }}";
    </script>
    <script src="{% static 'js/friend_activity.js' %}?v=4"></script>
    <style>
        /* Custom marquee starting from left (seamless loop) */
        .marquee-wrapper {
            overflow: hidden;
            white-space: nowrap;
            display: inline-flex;
            vertical-align: middle;
        }
        .marquee-left {
            display: flex;
            animation: marquee-left-anim 6s linear infinite;
        }
        @keyframes marquee-left-anim {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }
    </style>
