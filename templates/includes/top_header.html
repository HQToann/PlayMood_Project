<header class="top-header">
    <button class="btn-icon d-lg-none me-3" type="button" data-bs-toggle="offcanvas" data-bs-target="#mobileMenuOffcanvas">
        <i class="bi bi-list fs-3"></i>
    </button>
    <div class="search-bar me-auto position-relative">
        <i class="bi bi-search text-muted-custom"></i>
        <input type="text" id="topSearchInput" placeholder="Tìm bài hát, nghệ sĩ..." autocomplete="off">
        <div id="searchResultsDropdown" class="dropdown-menu dropdown-menu-dark shadow-lg w-100" style="display: none; position: absolute; top: 100%; left: 0; max-height: 400px; overflow-y: auto; background-color: var(--bg-card); border: 1px solid rgba(255,255,255,0.05); border-radius: 12px; margin-top: 10px; z-index: 1000;">
            <!-- Dữ liệu tìm kiếm sẽ được load vào đây -->
        </div>
    </div>
    
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const searchInput = document.getElementById('topSearchInput');
            const searchResults = document.getElementById('searchResultsDropdown');
            let searchTimeout;

            if (searchInput && searchResults) {
                searchInput.addEventListener('input', (e) => {
                    clearTimeout(searchTimeout);
                    const q = e.target.value.trim();
                    
                    if (q.length === 0) {
                        searchResults.style.display = 'none';
                        return;
                    }

                    searchTimeout = setTimeout(async () => {
                        try {
                            const res = await fetch(`/api/v1/search/?q=${encodeURIComponent(q)}&limit=5`);
                            const data = await res.json();
                            
                            if (data.success && data.data) {
                                const songs = data.data.songs || [];
                                const artists = data.data.artists || [];
                                // Gộp kết quả, ưu tiên 2 nghệ sĩ đầu, sau đó đến bài hát
                                let items = [...artists.slice(0,2), ...songs].slice(0,5);
                                
                                let html = '';
                                
                                // Tạo danh sách gợi ý từ khoá
                                let suggestions = [];
                                songs.forEach(s => {
                                    if (s.title && !suggestions.includes(s.title)) suggestions.push(s.title);
                                });
                                artists.forEach(a => {
                                    let name = a.stage_name || a.display_name || a.username;
                                    if (name && !suggestions.includes(name)) suggestions.push(name);
                                });
                                suggestions = suggestions.slice(0, 4);
                                
                                suggestions.forEach(text => {
                                    // Highlight phần khớp với từ khoá
                                    const escapedQ = q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
                                    const regex = new RegExp(`(${escapedQ})`, 'gi');
                                    const displayHTML = text.replace(regex, '<span class="fw-bold text-white">$1</span>');
                                    
                                    html += `
                                        <div class="dropdown-item py-2 px-3 d-flex align-items-center gap-3" style="cursor: pointer; transition: background 0.2s;" onclick="window.location.href='/search/?q=${encodeURIComponent(text)}'">
                                            <i class="bi bi-search fs-5 text-muted-custom"></i>
                                            <span style="font-size: 1rem; color: var(--text-secondary);">${displayHTML}</span>
                                        </div>
                                    `;
                                });
                                
                                if (items.length > 0) {
                                    items.forEach(item => {
                                        if (item.stage_name !== undefined) {
                                            // Đây là nghệ sĩ
                                            const avatar = item.avatar || (item.user && item.user.avatar) || 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=200&q=80';
                                            const name = item.stage_name || 'Nghệ sĩ';
                                            const profileLink = item.user ? `/profile/${item.user.id}` : `/profile/${item.id}`;
                                            
                                            html += `
                                                <div class="dropdown-item py-2 px-3 d-flex align-items-center justify-content-between" style="cursor: pointer; transition: background 0.2s;" onclick="window.location.href='${profileLink}'">
                                                    <div class="d-flex align-items-center gap-3">
                                                        <div style="position: relative; width: 48px; height: 48px;">
                                                            <img src="${avatar}" alt="Avatar" style="width: 100%; height: 100%; border-radius: 50%; object-fit: cover;">
                                                        </div>
                                                        <div>
                                                            <div style="font-size: 1rem; font-weight: 600; color: white;">${name}</div>
                                                            <div style="font-size: 0.85rem; color: var(--text-secondary);">Nghệ sĩ</div>
                                                        </div>
                                                    </div>
                                                    <button class="btn btn-outline-light rounded-pill btn-sm fw-bold px-3 py-1" onclick="event.stopPropagation();" style="font-size: 0.8rem; border-color: rgba(255,255,255,0.3);">
                                                        Theo dõi
                                                    </button>
                                                </div>
                                            `;
                                        } else {
                                            // Đây là bài hát (Song)
                                            const img = item.cover_image || 'https://images.unsplash.com/photo-1518609878373-06d740f60d8b?w=100&q=80';
                                            const artist = item.artist ? item.artist.display_name : 'Nghệ sĩ';
                                            html += `
                                                <div class="dropdown-item py-2 px-3 d-flex align-items-center justify-content-between" style="cursor: pointer; transition: background 0.2s;" onclick="window.location.href='/song/?id=${item.id}'">
                                                    <div class="d-flex align-items-center gap-3">
                                                        <div style="position: relative; width: 48px; height: 48px;">
                                                            <img src="${img}" alt="cover" style="width: 100%; height: 100%; border-radius: 4px; object-fit: cover;">
                                                        </div>
                                                        <div>
                                                            <div style="font-size: 1rem; font-weight: 600; color: white;">${item.title}</div>
                                                            <div style="font-size: 0.85rem; color: var(--text-secondary);">${artist}</div>
                                                        </div>
                                                    </div>
                                                    <button class="btn btn-link text-muted-custom p-0 text-decoration-none" onclick="event.stopPropagation();" style="font-size: 1.2rem;">
                                                        <i class="bi bi-plus-circle"></i>
                                                    </button>
                                                </div>
                                            `;
                                        }
                                    });
                                    
                                    // Nút Xem tất cả
                                    html += `
                                        <div class="p-3 pb-2">
                                            <a href="/search/?q=${encodeURIComponent(q)}" class="btn btn-outline-light rounded-pill px-3 py-1" style="font-size: 0.9rem; font-weight: 600; border-color: rgba(255,255,255,0.2);">
                                                Xem tất cả kết quả về "${q}"
                                            </a>
                                        </div>
                                    `;
                                    searchResults.innerHTML = html;
                                    searchResults.style.display = 'block';
                                } else {
                                    searchResults.innerHTML = '<div class="p-3 text-center text-muted-custom" style="font-size: 0.85rem;">Không tìm thấy kết quả nào</div>';
                                    searchResults.style.display = 'block';
                                }
                            } else {
                                searchResults.innerHTML = '<div class="p-3 text-center text-muted-custom" style="font-size: 0.85rem;">Không tìm thấy kết quả nào</div>';
                                searchResults.style.display = 'block';
                            }
                        } catch (err) {
                            console.error('Lỗi tìm kiếm:', err);
                        }
                    }, 400); // 400ms debounce
                });

                // Lắng nghe sự kiện nhấn Enter
                searchInput.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') {
                        e.preventDefault();
                        const q = searchInput.value.trim();
                        if (q.length > 0) {
                            window.location.href = `/search/?q=${encodeURIComponent(q)}`;
                        }
                    }
                });

                // Ẩn khi click ra ngoài
                document.addEventListener('click', (e) => {
                    if (!searchInput.contains(e.target) && !searchResults.contains(e.target)) {
                        searchResults.style.display = 'none';
                    }
                });
                
                // Hiện lại khi click vào ô search có nội dung
                searchInput.addEventListener('focus', () => {
                    if (searchInput.value.trim().length > 0 && searchResults.innerHTML.trim() !== '') {
                        searchResults.style.display = 'block';
                    }
                });
            }
        });
    </script>
    
    <div class="header-actions">
        <!-- Status Removed -->

        <a href="{% url 'notifications_page' %}" class="btn-icon d-xl-none text-decoration-none" style="display: inline-flex; align-items: center; justify-content: center; color: inherit;">
            <div class="position-relative d-inline-flex">
                <i class="bi bi-bell"></i>
                <span class="bell-badge position-absolute badge rounded-pill bg-danger" style="display:none; font-size: 0.55rem; padding: 2px 4px; top: 0; right: 0;"></span>
            </div>
        </a>
                                <div class="dropdown d-xl-none">
            <div class="user-profile" data-bs-toggle="dropdown" aria-expanded="false" style="cursor: pointer;">
                <img src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?ixlib=rb-4.0.3&auto=format&fit=crop&w=100&q=80" alt="avatar" class="user-avatar">
                <span style="font-size: 0.9rem; font-weight: 600; display: flex; align-items: center; gap: 4px;">
                    <span style="max-width: 80px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: inline-block;">{{ request.user.display_name|default:request.user.username }}</span>
                    <i class="bi bi-chevron-down small"></i>
                </span>
            </div>
            <ul class="dropdown-menu dropdown-menu-dark dropdown-menu-end shadow-lg" style="background-color: var(--bg-card); min-width: 200px; border-radius: 12px; margin-top: 10px; border: 1px solid rgba(255,255,255,0.05);">
                <li><a class="dropdown-item py-2" href="{% url 'profile_page' %}"><i class="bi bi-person me-3 text-muted-custom"></i> Hồ sơ cá nhân</a></li>
                <li><a class="dropdown-item py-2" href="{% url 'settings_page' %}"><i class="bi bi-gear me-3 text-muted-custom"></i> Cài đặt</a></li>
                <li><hr class="dropdown-divider border-secondary opacity-25"></li>
                <li><a class="dropdown-item py-2 text-danger" href="#" data-bs-toggle="modal" data-bs-target="#logoutConfirmModal"><i class="bi bi-box-arrow-right me-3"></i> Đăng xuất</a></li>
            </ul>
        </div>
        
    </div>
</header>
