{% load static %}
<header class="top-header">
    <button class="btn-icon d-lg-none me-3" type="button" data-bs-toggle="offcanvas" data-bs-target="#mobileMenuOffcanvas">
        <i class="bi bi-list fs-3"></i>
    </button>
    <div class="search-bar me-auto position-relative">
        <i class="bi bi-search text-muted-custom"></i>
        <input type="text" id="topSearchInput" placeholder="Tìm bài hát, nghệ sĩ..." autocomplete="off">
        <i class="bi bi-x-lg text-muted-custom" id="clearSearchBtn" style="cursor: pointer; display: none;" title="Xóa"></i>
        <div id="searchResultsDropdown" class="dropdown-menu dropdown-menu-dark shadow-lg w-100" style="display: none; position: absolute; top: 100%; left: 0; max-height: 400px; overflow-y: auto; background-color: var(--bg-card); border: 1px solid rgba(255,255,255,0.05); border-radius: 12px; margin-top: 10px; z-index: 1000;"></div>
    </div>
    
    <script src="{% static 'js/top_header.js' %}"></script>
    
    <div class="header-actions">
        <!-- Status Removed -->

        <a href="{% url 'notifications_page' %}" class="btn-icon d-xl-none text-decoration-none" style="display: inline-flex; align-items: center; justify-content: center; color: inherit;">
            <div class="position-relative d-inline-flex">
                <i class="bi bi-bell"></i>
                <span class="bell-badge position-absolute badge rounded-pill bg-danger" style="display:none; font-size: 0.55rem; padding: 2px 4px; top: 0; right: 0;"></span>
            </div>
        </a>
                                <div class="dropdown d-xl-none">
            <div class="user-profile" data-bs-toggle="dropdown" aria-expanded="false" style="cursor: pointer;">
                <img src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?ixlib=rb-4.0.3&auto=format&fit=crop&w=100&q=80" alt="avatar" class="user-avatar">
                <span style="font-size: 0.9rem; font-weight: 600; display: flex; align-items: center; gap: 4px;">
                    <span style="max-width: 80px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: inline-block;">{{ request.user.display_name|default:request.user.username }}</span>
                    <i class="bi bi-chevron-down small"></i>
                </span>
            </div>
            <ul class="dropdown-menu dropdown-menu-dark dropdown-menu-end shadow-lg" style="background-color: var(--bg-card); min-width: 200px; border-radius: 12px; margin-top: 10px; border: 1px solid rgba(255,255,255,0.05);">
                <li><a class="dropdown-item py-2" href="{% url 'profile_page' %}"><i class="bi bi-person me-3 text-muted-custom"></i> Hồ sơ cá nhân</a></li>
                <li><a class="dropdown-item py-2" href="{% url 'settings_page' %}"><i class="bi bi-gear me-3 text-muted-custom"></i> Cài đặt</a></li>
                <li><hr class="dropdown-divider border-secondary opacity-25"></li>
                <li><a class="dropdown-item py-2 text-danger" href="#" data-bs-toggle="modal" data-bs-target="#logoutConfirmModal"><i class="bi bi-box-arrow-right me-3"></i> Đăng xuất</a></li>
            </ul>
        </div>
        
    </div>
</header>
