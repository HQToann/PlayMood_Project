<!-- LEFT SIDEBAR -->
<aside class="sidebar-left py-3 d-none d-lg-flex">
    <div class="px-3 mb-4 flex-shrink-0">
        <a href="/" class="brand-logo">
            <div class="brand-icon"><i class="bi bi-music-note"></i></div>
            PlayMood
        </a>
    </div>

    <div class="flex-grow-1 overflow-auto custom-scrollbar">
        <div class="nav-section px-2">
            <a href="/" class="nav-link-custom {% if active_page == 'home' %}active{% endif %}">
                <i class="bi bi-house-door"></i> Trang chủ
            </a>
            <a href="#" class="nav-link-custom {% if active_page == 'explore' %}active{% endif %}">
                <i class="bi bi-search"></i> Khám phá
            </a>
            <a href="{% url 'mood_page' %}" class="nav-link-custom {% if active_page == 'mood' %}active{% endif %}">
                <i class="bi bi-emoji-smile"></i> Tâm trạng
            </a>
            <a href="{% url 'playlist_page' %}" class="nav-link-custom {% if active_page == 'playlist' %}active{% endif %}">
                <i class="bi bi-music-note-list"></i> Playlist
            </a>
            {% if request.user.role == 'artist' %}
            <a href="{% url 'artist_manage_page' %}" class="nav-link-custom {% if active_page == 'artist_manage' %}active{% endif %}">
                <i class="bi bi-kanban"></i> Quản lý bài hát
            </a>
            {% endif %}
        </div>

        <div class="nav-section-title mt-4">THƯ VIỆN</div>
        <div class="nav-section px-2">
            <a href="/library/favorites/" class="nav-link-custom {% if request.path == '/library/favorites/' %}active{% endif %}">
                <i class="bi bi-heart"></i> Yêu thích
            </a>
            <a href="/library/recent/" class="nav-link-custom {% if request.path == '/library/recent/' %}active{% endif %}">
                <i class="bi bi-clock-history"></i> Nghe gần đây
            </a>
        </div>

        <div class="nav-section-title mt-4">PLAYLIST CỦA BẠN</div>
        <div class="nav-section px-2 pb-4">
            <a href="#" class="nav-link-custom text-white" onclick="openCreatePlaylistModal(event)">
                <i class="bi bi-plus-lg text-secondary"></i> Tạo playlist mới
            </a>

            <div id="sidebarPlaylistsContainer">
                <div class="text-secondary text-center py-2" style="font-size: 0.8rem;">Đang tải...</div>
            </div>
        </div>
    </div>
</aside>

<script>
    document.addEventListener('DOMContentLoaded', async () => {
        const sidebarContainer = document.getElementById('sidebarPlaylistsContainer');
        if (!sidebarContainer) return;

        if (typeof window.CURRENT_USER_AUTHENTICATED !== 'undefined' && !window.CURRENT_USER_AUTHENTICATED) {
            sidebarContainer.innerHTML = '';
            return;
        }

        try {
            const res = await fetch('/api/v1/playlists/');
            if (!res.ok) throw new Error('Failed to load playlists');
            
            const data = await res.json();
            if (!data.success) throw new Error(data.error?.message || 'Lỗi tải playlist');
            
            const playlists = data.data.items || [];
            
            if (playlists.length === 0) {
                sidebarContainer.innerHTML = '';
                return;
            }

            let html = '';
            playlists.forEach((pl, index) => {
                const imgUrl = pl.cover_image || 'https://images.unsplash.com/photo-1518609878373-06d740f60d8b?ixlib=rb-4.0.3&auto=format&fit=crop&w=100&q=80';
                // Only show a limited number of playlists on sidebar (e.g. 10)
                if (index < 10) {
                    html += `
                        <a href="/playlist/detail/?id=${pl.id}" class="text-decoration-none text-white d-block">
                            <div class="playlist-item mt-2 hover-bg-light p-1 rounded" style="transition: background-color 0.2s;">
                                <img src="${imgUrl}" alt="cover" class="playlist-img">
                                <div>
                                    <div style="font-size: 0.85rem; font-weight: 600;" class="text-truncate">${pl.title}</div>
                                    <div style="font-size: 0.75rem; color: var(--text-secondary);" class="text-truncate">${pl.is_public ? 'Công khai' : 'Riêng tư'}</div>
                                </div>
                            </div>
                        </a>
                    `;
                }
            });
            
            sidebarContainer.innerHTML = html;
            
        } catch (error) {
            console.error('Sidebar playlists load error:', error);
            sidebarContainer.innerHTML = '';
        }
    });
</script>
