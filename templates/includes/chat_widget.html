<!-- templates/includes/chat_widget.html -->
<div id="chatWidget" class="chat-widget d-none">
    <!-- Header -->
    <div class="chat-header d-flex justify-content-between align-items-center">
        <a id="chatHeaderProfileLink" href="#" class="d-flex align-items-center gap-2 text-decoration-none text-white w-100">
            <div class="position-relative">
                <img id="chatHeaderAvatar" src="https://ui-avatars.com/api/?name=User" alt="Avatar" class="rounded-circle chat-avatar">
                <div id="chatHeaderOnlineDot" class="online-dot-chat"></div>
            </div>
            <div class="chat-header-info overflow-hidden">
                <h6 id="chatHeaderName" class="mb-0 fw-bold text-truncate">Tên bạn bè</h6>
                <small id="chatHeaderStatus" class="text-muted-custom">Trạng thái</small>
            </div>
        </a>
        <button id="closeChatBtn" class="btn btn-link text-white p-0 text-decoration-none">
            <i class="bi bi-x-lg"></i>
        </button>
    </div>

    <!-- Body (Tin nhắn) -->
    <div id="chatBody" class="chat-body">
        <div id="chatLoading" class="text-center py-4 d-none">
            <div class="spinner-border spinner-border-sm text-secondary" role="status"></div>
        </div>
        <div id="chatMessages" class="d-flex flex-column gap-2">
            <!-- Tin nhắn sẽ được JS render vào đây -->
        </div>
        <div id="chatTypingIndicator" class="typing-indicator d-none mt-2">
            <div class="typing-bubble">
                <div class="typing-dot"></div>
                <div class="typing-dot"></div>
                <div class="typing-dot"></div>
            </div>
        </div>
    </div>

    <!-- Footer (Nhập liệu) -->
    <div class="chat-footer">
        <!-- Chỗ chứa preview hình ảnh / bài hát nếu có -->
        <div id="chatAttachmentPreview" class="d-none align-items-center justify-content-between mb-2 p-2 rounded" style="background: rgba(255,255,255,0.05);">
            <div class="d-flex align-items-center gap-2 overflow-hidden" id="chatAttachmentPreviewContent">
                <!-- Nội dung preview sẽ được render bằng JS -->
            </div>
            <button type="button" id="chatRemoveAttachmentBtn" class="btn btn-sm btn-link text-danger p-0"><i class="bi bi-x-circle-fill fs-5"></i></button>
        </div>

        <form id="chatForm" class="d-flex align-items-end gap-2 m-0">
            <!-- Nút gửi hình ảnh -->
            <label for="chatImageInput" class="btn btn-link text-muted-custom p-1 m-0" title="Gửi ảnh">
                <i class="bi bi-image" style="font-size: 1.2rem;"></i>
            </label>
            <input type="file" id="chatImageInput" class="d-none" accept="image/*">
            
            <!-- Nút gửi nhạc/album/playlist -->
            <button type="button" class="btn btn-link text-muted-custom p-1 m-0" title="Gửi nhạc" data-bs-toggle="modal" data-bs-target="#chatShareMusicModal">
                <i class="bi bi-music-note-beamed" style="font-size: 1.2rem;"></i>
            </button>

            <!-- Ô nhập chữ -->
            <textarea id="chatInput" class="form-control chat-input" placeholder="Aa" rows="1"></textarea>
            
            <!-- Nút gửi -->
            <button type="submit" id="chatSendBtn" class="btn btn-link text-accent p-1 m-0" disabled>
                <i class="bi bi-send-fill" style="font-size: 1.2rem;"></i>
            </button>
        </form>
    </div>
</div>

<!-- Modal Chọn Nhạc để Gửi -->
<div class="modal fade" id="chatShareMusicModal" tabindex="-1" aria-hidden="true" style="z-index: 1070;">
    <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
        <div class="modal-content text-white" style="background-color: var(--bg-card); border: 1px solid rgba(255,255,255,0.1); border-radius: 16px;">
            <div class="modal-header border-bottom-0 pb-0">
                <h6 class="modal-title fw-bold">Chia sẻ Nhạc</h6>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <div class="search-bar mb-3 w-100" style="padding: 10px 16px; border-radius: 14px; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255,255,255,0.05);">
                    <i class="bi bi-search text-muted-custom" style="font-size: 1rem;"></i>
                    <input type="text" id="chatMusicSearchInput" placeholder="Tìm kiếm bài hát..." style="font-size: 0.95rem; background: none; border: none; color: white; outline: none; width: 85%; margin-left: 10px;">
                </div>
                
                <h6 id="chatShareMusicTitle" class="fw-bold text-muted-custom mb-3" style="font-size: 0.85rem;">GỢI Ý CHO BẠN</h6>
                <div id="chatShareMusicResults" class="d-flex flex-column gap-2">
                    <div class="text-center text-muted-custom py-4">
                        <div class="spinner-border spinner-border-sm" role="status"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
